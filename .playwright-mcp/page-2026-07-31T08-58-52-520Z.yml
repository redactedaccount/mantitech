    - generic [ref=f2e84]:
      - heading "Become a Galactic Business Tycoon" [level=2] [ref=f2e85]
      - text: Your entrepreneur journey begins with a single base on a strategically chosen planet – your first foothold in a vast galaxy brimming with opportunity. From this modest foundation, you'll expand your operations, carefully planning each step as you build, produce, and strategize your way to the top. Colonize new worlds, increase your industrial output, and optimize your production processes. With each successful venture, your wealth and influence will grow, transforming both yourself and your fledgling outpost – from a small-time operator into a true galactic business tycoon.
    - generic [ref=f2e88]:
      - heading "Production Chains and Manufacturing" [level=2] [ref=f2e89]
      - text: Craft a complex industrial network spanning multiple specialized industries. Mine raw ores, refine them into valuable metals, and manufacture everything from essential tools to advanced starship components. The interconnected production chains offer endless opportunities for optimization and strategic planning. No single player can master every industry in this space tycoon game. Choose your specializations wisely, focusing on key areas to become a dominant force in your chosen field. Will you control the flow of vital resources, become a manufacturing powerhouse, or a pioneer of cutting-edge technology?
    - generic [ref=f2e92]:
      - heading "Colonization and Resource Management" [level=2] [ref=f2e93]
      - text: Explore a vast and diverse galaxy, teeming with planets, each possessing unique resource distributions and environmental challenges. Strategically colonize new worlds, balancing the potential rewards with the logistical hurdles. The further you venture, the greater the riches - and the greater the risks. Colonization is a crucial strategic element. Carefully analyze resource yields, calculate transport routes, and optimize the layout of your bases. The right location can be the cornerstone of a thriving empire.
    - generic [ref=f2e96]:
      - heading "Player-Driven Market Economy" [level=2] [ref=f2e97]
      - text: The Galactic Exchange is the beating heart of the galaxy's economy. Here, you'll trade resources, components, and finished goods with other players, setting your own prices and reacting to the ever-shifting forces of supply and demand. Become a master of the market. Anticipate trends, negotiate profitable deals, and outmaneuver your competitors to amass wealth and power. Every transaction you make shapes the economic landscape of the galaxy.
    - generic [ref=f2e100]:
      - heading "Fleet and Logistics Management" [level=2] [ref=f2e101]
      - text: Your empire's success hinges on a robust and efficient interstellar logistics network. Build and upgrade a fleet of transport ships to move goods between your bases and the central Galactic Exchange. Invest in larger cargo capacities and advanced engines to maximize profits and extend your reach. Mastering the flow of goods is paramount. A well-optimized logistics system will keep your factories humming, your workforce supplied, and your treasury overflowing. Neglect it, and your empire will face stagnation.
    - generic [ref=f2e104]:
      - heading "Business Alliances and Competition" [level=2] [ref=f2e105]
      - text: Galactic Tycoons is a universe of both cooperation and competition. Forge alliances with other players by joining or creating powerful Guilds. Collaborate on large-scale projects, share resources, and unlock exclusive guild benefits. But remember, the galaxy is also a place of fierce competition. Rivalries will emerge, and only the most cunning and adaptable tycoons will rise to the top.
    - generic [ref=f2e108]:
      - heading "Research and Technology" [level=2] [ref=f2e109]
      - text: The path to galactic dominance is paved with technological innovation. Invest in research to unlock new buildings, more efficient production methods, and access to previously unreachable corners of the galaxy. Stay ahead of the technological curve to gain a decisive advantage. Discover rare resources, develop advanced technologies, and secure your place at the forefront of galactic progress.
